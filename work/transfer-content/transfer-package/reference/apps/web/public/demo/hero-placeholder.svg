<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Fondo abstracto de demostración</title>
  <desc id="description">Composición oscura con formas geométricas rojas y azules para el prototipo de MangaZone.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#080809"/>
      <stop offset="0.58" stop-color="#16161d"/>
      <stop offset="1" stop-color="#242431"/>
    </linearGradient>
    <radialGradient id="red-glow" cx="80%" cy="28%" r="56%">
      <stop offset="0" stop-color="#e8192c" stop-opacity=".88"/>
      <stop offset=".52" stop-color="#6e101d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#080809" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow" cx="64%" cy="82%" r="42%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".46"/>
      <stop offset="1" stop-color="#080809" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#red-glow)"/>
  <rect width="1600" height="900" fill="url(#blue-glow)"/>
  <circle cx="1210" cy="330" r="220" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="54"/>
  <circle cx="1210" cy="330" r="118" fill="#e8192c" fill-opacity=".16"/>
  <path d="M1010 730 1360 70l165 88-350 660z" fill="#ffffff" fill-opacity=".035"/>
  <path d="M840 840 1230 140l120 65-390 700z" fill="#e8192c" fill-opacity=".13" filter="url(#blur)"/>
  <g fill="#ffffff" fill-opacity=".12">
    <circle cx="1085" cy="170" r="5"/><circle cx="1450" cy="310" r="4"/>
    <circle cx="1320" cy="690" r="6"/><circle cx="930" cy="610" r="3"/>
  </g>
</svg>
